services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    volumes:
      - nexus-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://nexus:nexus@db:5432/nexus
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-change-me-in-production}
      PORT: 3000
      TZ: ${TZ:-UTC}
      RAGNAROK_TIME_ZONE: ${RAGNAROK_TIME_ZONE:-UTC}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - nexus-workspaces:/app/data/workspaces

volumes:
  nexus-db-data:
  nexus-workspaces:
